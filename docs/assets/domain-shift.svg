<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 596" width="1160" height="596" role="img" aria-label="External validation on four Ningxia hospitals: the caries branch holds up, moving from 44.3 percent internal agreement to 40.8 percent pooled external, while the bone-loss branch collapses from 0.9233 macro F1 in domain to 2.4 percent affected-tooth sensitivity externally">
  <title>Two branches, two fates under domain shift</title>
  <desc>Four Ningxia hospitals, locked external test data evaluated once with per-corpus leakage checks. The caries path degrades gracefully: 44.3 percent internal to 40.8 percent pooled external, a 3.5 point gap. The bone-loss path does not transfer at all: 0.9233 macro F1 on Tufts, firing on 0.7 percent of DENTEX teeth and 2.4 percent affected-tooth sensitivity across Ningxia. Two independent external datasets with different ground-truth formats and different metrics agree, which makes this a property of the model rather than a harness artefact.</desc>
  <defs>
    <style>
      .f  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .kk { font-size: 10px; letter-spacing: 1.3px; font-weight: 700; fill: #5f7d97; }
      .hd { font-size: 17px; font-weight: 680; fill: #eaf3fa; }
      .ph { font-size: 14.5px; font-weight: 700; }
      .ax { font-size: 10.5px; fill: #4d6a84; }
      .lb { font-size: 12px; fill: #cfe0ee; }
      .no { font-size: 11px; fill: #7189a0; }
      .nm { font-size: 12.5px; font-weight: 700; }
      .grow { transform-origin: left center; animation: gw 1.1s cubic-bezier(.22,.85,.3,1) both; }
      @keyframes gw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .blink { animation: bk 2.6s ease-in-out infinite; }
      @keyframes bk { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) { .grow, .blink { animation: none } }
    </style>
  </defs>

  <rect width="1160" height="596" rx="14" fill="#0a1626"/>
  <rect x="0.5" y="0.5" width="1159" height="595" rx="14" fill="none" stroke="#1c3a52" stroke-width="1"/>

  <text class="f kk" x="40" y="42">CONTRIBUTION C2 &#183; EXTERNAL VALIDATION &#183; 4 NINGXIA HOSPITALS, LOCKED AND EVALUATED ONCE</text>
  <text class="f hd" x="40" y="70">Same pipeline, same images. One branch survives the border; the other does not.</text>

  <!-- ============ PANEL A : CARIES ============ -->
  <rect x="40" y="96" width="530" height="418" rx="12" fill="#0c2032" stroke="#1b3a52" stroke-width="1"/>
  <rect x="40" y="96" width="530" height="3" rx="1.5" fill="#fbbf24"/>
  <text class="f ph" x="66" y="128" fill="#fbbf24">CARIES &#8212; degrades gracefully</text>
  <text class="f no" x="66" y="147">Focal-lesion centroid containment. The denominator is</text>
  <text class="f no" x="66" y="163">ground-truth derived, so it is model-independent.</text>

  <!-- scale: 0..60% over 300px from x=250 -> 5px per % -->
  <g stroke="#16304a" stroke-width="1">
    <line x1="250" y1="178" x2="250" y2="404"/><line x1="350" y1="178" x2="350" y2="404"/>
    <line x1="450" y1="178" x2="450" y2="404"/><line x1="550" y1="178" x2="550" y2="404"/>
  </g>
  <g class="f ax" text-anchor="middle">
    <text x="250" y="422">0</text><text x="350" y="422">20%</text><text x="450" y="422">40%</text><text x="550" y="422">60%</text>
  </g>

  <g transform="translate(250,188)"><rect class="grow" width="221.5" height="24" rx="3.5" fill="#5eead4" style="animation-delay:.05s"/></g>
  <text class="f lb" x="238" y="205" text-anchor="end">DENTEX internal</text>
  <text class="f nm" x="482" y="205" fill="#5eead4">44.3%</text>

  <line x1="66" y1="228" x2="550" y2="228" stroke="#16304a" stroke-width="1" stroke-dasharray="3 4"/>
  <text class="f no" x="66" y="248" fill="#5f7d97">FOUR INDEPENDENT HOSPITALS &#8212; NEVER TRAINED OR TUNED ON</text>

  <g transform="translate(250,258)"><rect class="grow" width="144" height="22" rx="3.5" fill="#fbbf24" style="animation-delay:.16s"/></g>
  <text class="f lb" x="238" y="274" text-anchor="end">test1 &#183; 316 lesions</text>
  <text class="f nm" x="404" y="274" fill="#fbbf24">28.8%</text>

  <g transform="translate(250,290)"><rect class="grow" width="256.5" height="22" rx="3.5" fill="#fbbf24" style="animation-delay:.22s"/></g>
  <text class="f lb" x="238" y="306" text-anchor="end">test2 &#183; 349 lesions</text>
  <text class="f nm" x="517" y="306" fill="#fbbf24">51.3%</text>

  <g transform="translate(250,322)"><rect class="grow" width="200.5" height="22" rx="3.5" fill="#fbbf24" style="animation-delay:.28s"/></g>
  <text class="f lb" x="238" y="338" text-anchor="end">test3 &#183; 162 lesions</text>
  <text class="f nm" x="461" y="338" fill="#fbbf24">40.1%</text>

  <g transform="translate(250,354)"><rect class="grow" width="209.5" height="22" rx="3.5" fill="#fbbf24" style="animation-delay:.34s"/></g>
  <text class="f lb" x="238" y="370" text-anchor="end">test4 &#183; 186 lesions</text>
  <text class="f nm" x="470" y="370" fill="#fbbf24">41.9%</text>

  <g transform="translate(250,386)"><rect class="grow" width="204" height="22" rx="3.5" fill="#a16207" style="animation-delay:.40s"/></g>
  <text class="f lb" x="238" y="402" text-anchor="end">pooled &#8212; scale only</text>
  <text class="f nm" x="466" y="402" fill="#eab308">40.8%</text>

  <text class="f lb" x="66" y="452">Internal &#8594; external gap: <tspan fill="#5eead4" font-weight="700">3.5 pp</tspan>, halved from 8.9 pp</text>
  <text class="f lb" x="66" y="470">by the detector swap alone.</text>
  <text class="f no" x="66" y="494">Still weak in absolute terms, and three of four hospitals sit below the</text>
  <text class="f no" x="66" y="508">internal figure. Not a claim that caries generalises well.</text>

  <!-- ============ PANEL B : BONE LOSS ============ -->
  <rect x="590" y="96" width="530" height="418" rx="12" fill="#0c2032" stroke="#1b3a52" stroke-width="1"/>
  <rect x="590" y="96" width="530" height="3" rx="1.5" fill="#fb7185"/>
  <text class="f ph" x="616" y="128" fill="#fb7185">BONE LOSS &#8212; does not transfer</text>
  <text class="f no" x="616" y="147">A decided limitation, reported rather than patched. The metric</text>
  <text class="f no" x="616" y="163">changes with the corpus &#8212; read each label.</text>

  <g transform="translate(616,192)">
    <text class="f no" x="0" y="0" fill="#5f7d97">TUFTS &#8212; IN DOMAIN, VALIDATION AT REAL PREVALENCE</text>
    <rect class="grow" x="0" y="12" width="478" height="44" rx="5" fill="#34d399" style="animation-delay:.06s"/>
    <text class="f" x="16" y="41" font-size="20" font-weight="700" fill="#05291c">0.9233 macro F1</text>
    <text class="f" x="462" y="41" text-anchor="end" font-size="11" fill="#0a4630">1,558 crops</text>
  </g>

  <g class="blink">
    <path d="M855 262 L855 292" stroke="#fb7185" stroke-width="2" fill="none"/>
    <path d="M849 286 L855 296 L861 286 z" fill="#fb7185"/>
  </g>

  <g transform="translate(616,308)">
    <text class="f no" x="0" y="0" fill="#5f7d97">DENTEX &#8212; EXTERNAL</text>
    <rect x="0" y="12" width="478" height="32" rx="5" fill="#12283c"/>
    <rect class="grow" x="0" y="12" width="3.3" height="32" rx="1.6" fill="#fb7185" style="animation-delay:.5s"/>
    <text class="f" x="18" y="33" font-size="15" font-weight="700" fill="#fb7185">0.7%</text>
    <text class="f no" x="66" y="33">of detected teeth ever flagged &#183; 164 images</text>
  </g>

  <g transform="translate(616,372)">
    <text class="f no" x="0" y="0" fill="#5f7d97">NINGXIA &#8212; EXTERNAL, 4 HOSPITALS</text>
    <rect x="0" y="12" width="478" height="32" rx="5" fill="#12283c"/>
    <rect class="grow" x="0" y="12" width="11.5" height="32" rx="3" fill="#fb7185" style="animation-delay:.6s"/>
    <text class="f" x="26" y="33" font-size="15" font-weight="700" fill="#fb7185">2.4%</text>
    <text class="f no" x="74" y="33">affected-tooth sensitivity &#183; 6,791 teeth, 736 images</text>
  </g>

  <text class="f lb" x="616" y="452">The shared-root-cause hypothesis was <tspan fill="#fb7185" font-weight="700">tested and falsified</tspan>.</text>
  <text class="f no" x="616" y="472">The detector swap moved Stage 2 by +12.0 pts and caries by +7.7 pts &#8212;</text>
  <text class="f no" x="616" y="486">and bone loss by nothing: 168 affected teeth flagged before, 165 after,</text>
  <text class="f no" x="616" y="500">while the denominator grew 9%.</text>

  <line x1="40" y1="536" x2="1120" y2="536" stroke="#1c3a52" stroke-width="1"/>
  <text class="f no" x="40" y="560">Two independent external datasets &#8212; different ground-truth formats (LabelMe polygons vs raster masks), different metrics &#8212; agree.</text>
  <text class="f no" x="40" y="578">A single external failure could be a harness artefact; this project has already withdrawn one number for exactly that reason. Two is a property of the model.</text>
</svg>
