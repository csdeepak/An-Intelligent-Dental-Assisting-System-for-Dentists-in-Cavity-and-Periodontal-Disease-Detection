<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Architecture of the implemented six-stage pipeline</title>
  <desc>Implementation diagram traced to scripts/run_inference.py DEF_* defaults, src/fdi_head_inference.py and app.py. No performance values.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <!-- input -->
  <rect x="10" y="20" width="96" height="46" rx="4" fill="#f2f2f2" stroke="#333"/>
  <text x="58" y="40" text-anchor="middle" font-weight="bold">Input</text>
  <text x="58" y="56" text-anchor="middle">OPG image</text>
  <!-- stage 1 -->
  <rect x="130" y="14" width="150" height="58" rx="4" fill="#e8f1fa" stroke="#0072B2"/>
  <text x="205" y="33" text-anchor="middle" font-weight="bold">Stage 1: tooth detection</text>
  <text x="205" y="49" text-anchor="middle">YOLOv11l-seg</text>
  <text x="205" y="63" text-anchor="middle">boxes used</text>
  <!-- stage 2 -->
  <rect x="304" y="14" width="170" height="58" rx="4" fill="#e8f1fa" stroke="#0072B2"/>
  <text x="389" y="33" text-anchor="middle" font-weight="bold">Stage 2: FDI numbering</text>
  <text x="389" y="49" text-anchor="middle">ResNet18 + 4 positional feats</text>
  <text x="389" y="63" text-anchor="middle">Hungarian one-to-one</text>
  <line x1="106" y1="43" x2="128" y2="43" stroke="#333" marker-end="url(#a)"/>
  <line x1="280" y1="43" x2="302" y2="43" stroke="#333" marker-end="url(#a)"/>
  <!-- branch split -->
  <line x1="389" y1="72" x2="389" y2="96" stroke="#333"/>
  <line x1="170" y1="96" x2="560" y2="96" stroke="#333"/>
  <line x1="170" y1="96" x2="170" y2="116" stroke="#333" marker-end="url(#a)"/>
  <line x1="480" y1="96" x2="480" y2="116" stroke="#333" marker-end="url(#a)"/>
  <!-- caries -->
  <rect x="20" y="118" width="300" height="104" rx="4" fill="#fdf3e1" stroke="#E69F00"/>
  <text x="170" y="136" text-anchor="middle" font-weight="bold">Stage 3: caries</text>
  <rect x="32" y="146" width="136" height="42" rx="3" fill="#ffffff" stroke="#E69F00"/>
  <text x="100" y="163" text-anchor="middle">3a lesion detector</text>
  <text x="100" y="179" text-anchor="middle">YOLOv11l (default)</text>
  <rect x="176" y="146" width="132" height="42" rx="3" fill="#ffffff" stroke="#E69F00" stroke-dasharray="4 3"/>
  <text x="242" y="163" text-anchor="middle">3a per-crop gate</text>
  <text x="242" y="179" text-anchor="middle">ResNet18 (variant)</text>
  <text x="170" y="210" text-anchor="middle">3b severity: ResNet18 on flagged teeth</text>
  <!-- bone loss -->
  <rect x="340" y="118" width="280" height="104" rx="4" fill="#e6f5ef" stroke="#009E73"/>
  <text x="480" y="136" text-anchor="middle" font-weight="bold">Stage 4: periodontal bone loss</text>
  <text x="480" y="160" text-anchor="middle">4a gate: ResNet18</text>
  <text x="480" y="178" text-anchor="middle">(crop 1.5x width, 2.0x height)</text>
  <text x="480" y="210" text-anchor="middle">4b severity: ResNet18 on flagged teeth</text>
  <!-- fusion -->
  <line x1="170" y1="222" x2="170" y2="244" stroke="#333"/>
  <line x1="480" y1="222" x2="480" y2="244" stroke="#333"/>
  <line x1="170" y1="244" x2="480" y2="244" stroke="#333"/>
  <line x1="320" y1="244" x2="320" y2="258" stroke="#333" marker-end="url(#a)"/>
  <rect x="150" y="260" width="340" height="50" rx="4" fill="#f2f2f2" stroke="#333"/>
  <text x="320" y="280" text-anchor="middle" font-weight="bold">Stages 5-6: fuse on FDI code</text>
  <text x="320" y="298" text-anchor="middle">per-tooth JSON record + optional overlay</text>
  <rect x="512" y="266" width="118" height="38" rx="4" fill="#ffffff" stroke="#333" stroke-dasharray="4 3"/>
  <text x="571" y="289" text-anchor="middle">Streamlit demo</text>
  <line x1="490" y1="285" x2="510" y2="285" stroke="#333" marker-end="url(#a)"/>
</svg>
